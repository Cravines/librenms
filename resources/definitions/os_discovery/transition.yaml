modules:
    os:
        hardware: 
            - SM8TAT2SA-MIB::sm8tat2saSystemInfoModelName.0
            - SM16TAT2SA-MIB::sm16tat2saSystemInfoModelName.0
            - SM24TAT2SA-MIB::sm24tat2saSystemInfoModelName.0
            - SM24TAT4XB-MIB::sm24tat4xbSystemInfoModelName.0
            - SM48TAT4XARP-MIB::sm48tat4xarpSystemInfoModelName.0
            - SISPM10403166L-MIB::sispm10403166lSystemInfoModelName.0
        version: 
            - SM8TAT2SA-MIB::sm8tat2saSystemInfoFirmwareVersion.0
            - SM16TAT2SA-MIB::sm16tat2saSystemInfoFirmwareVersion.0
            - SM24TAT2SA-MIB::sm24tat2saSystemInfoFirmwareVersion.0
            - SM24TAT4XB-MIB::sm24tat4xbSystemInfoFirmwareVersion.0
            - SM48TAT4XARP-MIB::sm48tat4xarpSystemInfoFirmwareVersion.0
            - SISPM10403166L-MIB::sispm10403166lSystemInfoFirmwareVersion.0
        serial:
            - SM8TAT2SA-MIB::sm8tat2saSystemInfoSeriesNumber.0
            - SM16TAT2SA-MIB::sm16tat2saSystemInfoSeriesNumber.0
            - SM24TAT2SA-MIB::sm24tat2saSystemInfoSeriesNumber.0
            - SM24TAT4XB-MIB::sm24tat4xbSystemInfoSeriesNumber.0
            - SISPM10403166L-MIB::sispm10403166lSystemInfoSeriesNumber.0

    sensors:
        power:
            options:
                skip_value_lt: 1
            data:
                -
                    oid: SM8TAT2SA-MIB::sm8tat2saPoeStatusTable
                    value: SM8TAT2SA-MIB::sm8tat2saPoeStatusPowerUsed
                    num_oid: '.1.3.6.1.4.1.868.2.71.2.13.2.1.1.3.{{ $index }}'
                    index: 'sm8tat2saPoeStatusPowerUsed.{{ $index }}'
                    descr: "Port {{ $index }}"
                -
                    oid: SM16TAT2SA-MIB::sm16tat2saPoeStatusTable
                    value: SM16TAT2SA-MIB::sm16tat2saPoeStatusPowerUsed
                    num_oid: '.1.3.6.1.4.1.868.2.72.2.13.2.1.1.3.{{ $index }}'
                    index: 'sm16tat2saPoeStatusPowerUsed.{{ $index }}'
                    descr: "Port {{ $index }}"
                -
                    oid: SM24TAT2SA-MIB::sm24tat2saPoeStatusTable
                    value: SM24TAT2SA-MIB::sm24tat2saPoeStatusPowerUsed
                    num_oid: '.1.3.6.1.4.1.868.2.73.2.13.2.1.1.3.{{ $index }}'
                    index: 'sm24tat2saPoeStatusPowerUsed.{{ $index }}'
                    descr: "Port {{ $index }}"
                -
                    oid: SM24TAT4XB-MIB::sm24tat4xbPoeStatusTable
                    value: SM24TAT4XB-MIB::sm24tat4xbPoeStatusPowerUsed
                    num_oid: '.1.3.6.1.4.1.868.2.77.2.2.13.1.1.1.5.{{ $index }}'
                    index: 'sm24tat4xbPoeStatusPowerUsed.{{ $index }}'
                    descr: "Port {{ $index }}"
                -
                    oid: SM48TAT4XARP-MIB::sm48tat4xarpPoeStatusTable
                    value: SM48TAT4XARP-MIB::sm48tat4xarpPoeStatusPowerUsed
                    num_oid: '.1.3.6.1.4.1.868.2.77.4.2.13.1.1.1.5.{{ $index }}'
                    index: 'sm48tat4xarpPoeStatusPowerUsed.{{ $index }}'
                    descr: "Port {{ $index }}"
        temperature:
            data:
                -
                    oid: SM24TAT4XB-MIB::sm24tat4xbTemperature1
                    value: SM24TAT4XB-MIB::sm24tat4xbTemperature1Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.77.2.1.13.1.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 1"
                    index: 'sm24tat4xbTemperature1CelsiusValue.{{ $index }}'
                -
                    oid: SM24TAT4XB-MIB::sm24tat4xbTemperature2
                    value: SM24TAT4XB-MIB::sm24tat4xbTemperature2Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.77.2.1.13.2.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 2"
                    index: 'sm24tat4xbTemperature2CelsiusValue.{{ $index }}'
                - 
                    oid: SM48TAT4XARP-MIB::sm48tat4xarpTemperature1
                    value: SM48TAT4XARP-MIB::sm48tat4xarpTemperature1Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.77.4.1.13.1.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 1"
                    index: 'sm48tat4xarpTemperature1CelsiusValue.{{ $index }}'
                - 
                    oid: SM48TAT4XARP-MIB::sm48tat4xarpTemperature2
                    value: SM48TAT4ARP-MIB::sm48tat4xarpTemperature2Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.77.4.1.13.2.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 2"
                    index: 'sm48tat4xarpTemperature2CelsiusValue.{{ $index }}'
                -
                    oid: SISPM10403166L-MIB::sispm10403166lTemperature1
                    value: SISPM10403166L-MIB::sispm10403166lTemperature1Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.80.4.1.13.1.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 1"
                    index: 'sispm10403166lTemperature1CelsiusValue.{{ $index }}'
                -
                    oid: SISPM10403166L-MIB::sispm10403166lTemperature2
                    value: SISPM10403166L-MIB::sispm10403166lTemperature2Celsius
                    num_oid: '.1.3.6.1.4.1.868.2.80.4.1.13.2.1.{{ $index }}'
                    low_limit: 0
                    high_limit: 100
                    descr: "Temperature 2"
                    index: 'sispm10403166lTemperature2CelsiusValue.{{ $index }}'
        state:
            data:
                -
                    oid: SM48TAT4XARP-MIB::sm48tat4xarpPowerInformation
                    value: SM48TAT4XARP-MIB::sm48tat4xarpPowerInfoDetectedPSUA
                    num_oid: '.1.3.6.1.4.1.868.2.77.4.1.1.2.2.{{ $index }}'
                    descr: 'Power Supply A {{ $index }}'
                    index: 'sm48tat4xarpPowerInfoDetectedPSUA.{{ $index }}'
                    state_name: PowerSupply A
                    group: Power
                    states: 
                        - { descr: Fail, value: 0, generic: 2 }
                        - { descr: Good, value: 1, generic: 0}
                -
                    oid: SM48TAT4XARP-MIB::sm48tat4xarpPowerInformation
                    value: SM48TAT4XARP-MIB::sm48tat4xarpPowerInfoDetectedPSUB
                    num_oid: '.1.3.6.1.4.1.868.2.77.4.1.1.2.3.{{ $index }}'
                    descr: 'Power Supply B {{ $index }}'
                    index: 'sm48tat4xarpPowerInfoDetectedPSUB.{{ $index }}'
                    state_name: PowerSupply B
                    group: Power
                    states: 
                        - { descr: Fail, value: 0, generic: 2 }
                        - { descr: Good, value: 1, generic: 0}
                